version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: qwikmailer_postgres
    environment:
      POSTGRES_USER: qwikmailer
      POSTGRES_PASSWORD: qwikmailer_secret
      POSTGRES_DB: qwikmailer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qwikmailer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qwikmailer_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev:latest
    container_name: qwikmailer_maildev
    ports:
      - "1080:1080"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      MAILDEV_SMTP_PORT: 1025
      MAILDEV_WEB_PORT: 1080

volumes:
  postgres_data:
  redis_data:
