<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Septet Labs: Geometric S/7 Monogram Logo -->
  <defs>
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Black / Dark Background Rounded Container -->
  <rect width="100" height="100" rx="22" fill="#09090b" />
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="#27272a" stroke-width="2" />

  <!-- Geometric "S" fused with numeral "7" -->
  <!-- Top Horizontal Bar of 7 & S -->
  <path d="M 22 30 L 78 30" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
  
  <!-- Diagonal Slash of 7 -->
  <path d="M 76 30 L 46 62 L 74 62 L 74 76 L 24 76" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Cross Overlap -->
  <path d="M 38 46 L 62 46" stroke="#2563EB" stroke-width="7" stroke-linecap="round" />

  <!-- Electric Cobalt Accent Node -->
  <circle cx="76" cy="30" r="6" fill="url(#cobaltGrad)" filter="url(#glow)" />
</svg>
