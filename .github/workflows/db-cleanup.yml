name: DB Cleanup — Remove Test Data

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Full DB reset + Redis flush
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "=== STEP 1: Stop API + Worker ==="
          pm2 stop api worker || true
          sleep 3

          echo "=== STEP 2: Flush Redis completely ==="
          sudo docker exec qwikmailer_redis redis-cli FLUSHALL
          echo "✅ Redis cleared"

          echo "=== STEP 3: Drop & recreate database ==="
          # Connect to postgres db (not qwikmailer) to drop
          sudo docker exec qwikmailer_postgres psql -U qwikmailer -d postgres -c "
            SELECT pg_terminate_backend(pid)
            FROM pg_stat_activity
            WHERE datname = 'qwikmailer' AND pid <> pg_backend_pid();
          "
          sudo docker exec qwikmailer_postgres psql -U qwikmailer -d postgres -c "DROP DATABASE IF EXISTS qwikmailer;"
          sudo docker exec qwikmailer_postgres psql -U qwikmailer -d postgres -c "CREATE DATABASE qwikmailer OWNER qwikmailer;"
          echo "✅ Database dropped and recreated fresh"

          echo "=== STEP 4: Run all migrations ==="
          cd /home/ubuntu/qwikmailer
          git pull origin main

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          # Run the API once briefly to trigger auto-migration (startup migration in app.ts)
          # Or run migrations manually via psql
          sudo docker exec qwikmailer_postgres psql -U qwikmailer -d qwikmailer -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";" 2>/dev/null || true
          sudo docker exec qwikmailer_postgres psql -U qwikmailer -d qwikmailer -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";" 2>/dev/null || true

          echo "✅ Extensions ready — API startup will run full migration"

          echo "=== STEP 5: Restart API (triggers auto-migration) ==="
          cd /home/ubuntu/qwikmailer/apps/api
          pm2 start api || pm2 start dist/server.js --name api
          sleep 8
          echo "✅ API restarted and migrations applied"

          echo "=== STEP 6: Restart Worker ==="
          pm2 start worker || pm2 start dist/worker.js --name worker
          pm2 save

          echo ""
          echo "=== DB table list ==="
          sudo docker exec qwikmailer_postgres psql -U qwikmailer -d qwikmailer -c "\dt"
          echo "=== ✅ FRESH DATABASE READY ==="
