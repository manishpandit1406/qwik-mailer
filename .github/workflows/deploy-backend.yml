name: Deploy to EC2 (Full Stack)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - '*.conf'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # ── Go to project or clone ──────────────────────────
          if [ ! -d "/home/ubuntu/qwikmailer" ]; then
            git clone https://github.com/manishpandit1406/qwik-mailer.git /home/ubuntu/qwikmailer
          fi

          cd /home/ubuntu/qwikmailer

          # Discard local changes (e.g. accidental .env edits)
          git stash

          # Pull latest code
          git pull origin main

          # ── Load NVM ─────────────────────────────────────────
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          # ── Start DB + Redis ──────────────────────────────────
          sudo docker-compose up -d postgres redis

          # ── Install dependencies ──────────────────────────────
          pnpm install

          # ── DB Migrations ─────────────────────────────────────
          echo "Running DB migrations..."

          # sandbox_mode on teams
          sudo docker exec qwikmailer_postgres psql -U qwikmailer -d qwikmailer -c "
            ALTER TABLE teams ADD COLUMN IF NOT EXISTS sandbox_mode boolean NOT NULL DEFAULT false;
          " && echo "✅ sandbox_mode column OK"

          # sandbox_emails table
          sudo docker exec qwikmailer_postgres psql -U qwikmailer -d qwikmailer -c "
            CREATE TABLE IF NOT EXISTS sandbox_emails (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid() NOT NULL,
              team_id uuid NOT NULL REFERENCES teams(id) ON DELETE CASCADE,
              from_email varchar(255) NOT NULL,
              from_name varchar(255),
              to_email varchar(255) NOT NULL,
              to_name varchar(255),
              reply_to varchar(255),
              subject text NOT NULL,
              html_body text,
              text_body text,
              raw_headers jsonb DEFAULT '{}'::jsonb,
              attachments jsonb DEFAULT '[]'::jsonb,
              metadata jsonb DEFAULT '{}'::jsonb,
              is_read boolean NOT NULL DEFAULT false,
              expires_at timestamp NOT NULL,
              created_at timestamp NOT NULL DEFAULT now()
            );
            CREATE INDEX IF NOT EXISTS sandbox_emails_team_idx ON sandbox_emails (team_id);
            CREATE INDEX IF NOT EXISTS sandbox_emails_expires_at_idx ON sandbox_emails (expires_at);
            CREATE INDEX IF NOT EXISTS sandbox_emails_created_at_idx ON sandbox_emails (created_at);
          " && echo "✅ sandbox_emails table OK"

          # forms table (QwikForms)
          sudo docker exec qwikmailer_postgres psql -U qwikmailer -d qwikmailer -c "
            CREATE TABLE IF NOT EXISTS forms (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid() NOT NULL,
              team_id uuid NOT NULL REFERENCES teams(id) ON DELETE CASCADE,
              name varchar(255) NOT NULL,
              status varchar(50) NOT NULL DEFAULT 'draft',
              schema jsonb NOT NULL DEFAULT '[]'::jsonb,
              design jsonb NOT NULL DEFAULT '{}'::jsonb,
              settings jsonb NOT NULL DEFAULT '{}'::jsonb,
              submissions integer NOT NULL DEFAULT 0,
              views integer NOT NULL DEFAULT 0,
              created_at timestamp NOT NULL DEFAULT now(),
              updated_at timestamp NOT NULL DEFAULT now()
            );
            CREATE INDEX IF NOT EXISTS forms_team_id_idx ON forms (team_id);
          " && echo "✅ forms table OK"

          # form_submissions table
          sudo docker exec qwikmailer_postgres psql -U qwikmailer -d qwikmailer -c "
            CREATE TABLE IF NOT EXISTS form_submissions (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid() NOT NULL,
              form_id uuid NOT NULL REFERENCES forms(id) ON DELETE CASCADE,
              team_id uuid NOT NULL REFERENCES teams(id) ON DELETE CASCADE,
              contact_id uuid REFERENCES contacts(id) ON DELETE SET NULL,
              data jsonb NOT NULL DEFAULT '{}'::jsonb,
              ip varchar(100),
              user_agent text,
              created_at timestamp NOT NULL DEFAULT now()
            );
            CREATE INDEX IF NOT EXISTS form_submissions_form_id_idx ON form_submissions (form_id);
            CREATE INDEX IF NOT EXISTS form_submissions_team_id_idx ON form_submissions (team_id);
            CREATE INDEX IF NOT EXISTS form_submissions_created_at_idx ON form_submissions (created_at);
          " && echo "✅ form_submissions table OK"

          # ── Build API ─────────────────────────────────────────
          echo "Building API..."
          pnpm run build --filter=@qwikmailer/api

          # Restart API + Worker
          cd apps/api
          pm2 restart api || pm2 start dist/server.js --name api --node-args="--import tsx --env-file=../../.env"
          pm2 restart worker || pm2 start dist/worker.js --name worker --node-args="--import tsx --env-file=../../.env"
          cd ../..

          # ── Build Web (Next.js) ───────────────────────────────
          echo "Building Web..."
          # Inject production env vars for Next.js build
          export NEXT_PUBLIC_API_URL=https://api.qwikmailer.in
          export NEXT_PUBLIC_APP_URL=https://qwikmailer.in
          export NEXT_PUBLIC_FORMS_URL=https://forms.qwikmailer.in
          pnpm run build --filter=@qwikmailer/web

          # Restart Next.js with PM2
          cd apps/web
          pm2 restart web || pm2 start "npx next start -p 3000" --name web
          cd ../..

          # ── Nginx: forms.qwikmailer.in ────────────────────────
          echo "Configuring Nginx for forms.qwikmailer.in..."
          sudo cp /home/ubuntu/qwikmailer/forms.qwikmailer.in.conf /etc/nginx/sites-available/forms.qwikmailer.in
          sudo ln -sf /etc/nginx/sites-available/forms.qwikmailer.in /etc/nginx/sites-enabled/forms.qwikmailer.in
          sudo nginx -t && sudo systemctl reload nginx && echo "✅ Nginx reloaded"

          # ── SSL for forms.qwikmailer.in ───────────────────────
          # Only request cert if not already issued
          if [ ! -d "/etc/letsencrypt/live/forms.qwikmailer.in" ]; then
            echo "Requesting SSL cert for forms.qwikmailer.in..."
            sudo certbot --nginx -d forms.qwikmailer.in --non-interactive --agree-tos -m admin@qwikmailer.in && echo "✅ SSL cert issued"
          else
            echo "✅ SSL cert already exists for forms.qwikmailer.in"
          fi

          # ── Save PM2 state ────────────────────────────────────
          pm2 save

          echo "🚀 Full deploy complete!"
