name: Emergency — Flush Email Queue

on:
  workflow_dispatch:

jobs:
  flush:
    runs-on: ubuntu-latest
    steps:
    - name: Flush Redis queue and restart worker
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "=== Stopping worker ==="
          pm2 stop worker || true

          echo "=== Flushing all BullMQ queues in Redis ==="
          sudo docker exec qwikmailer_redis redis-cli KEYS "bull:*" | xargs -r sudo docker exec -i qwikmailer_redis redis-cli DEL
          sudo docker exec qwikmailer_redis redis-cli FLUSHDB
          echo "✅ Redis queues flushed"

          echo "=== Restarting worker (clean state) ==="
          pm2 start worker || true
          pm2 save

          echo "=== Queue size after flush ==="
          sudo docker exec qwikmailer_redis redis-cli DBSIZE
          echo "=== DONE ==="
